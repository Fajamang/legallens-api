<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalLens - AI Contract Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 40px; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
        }
        .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        textarea { min-height: 200px; resize: vertical; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading { display: none; text-align: center; padding: 40px; }
        .loading.active { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        .result.active { display: block; }
        .result h3 { color: #667eea; margin-bottom: 15px; }
        .result-section { margin-bottom: 20px; }
        .result-section h4 { color: #333; margin-bottom: 10px; }
        .risk-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ff6b6b;
        }
        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }
        .severity-low { background: #51cf66; }
        .severity-medium { background: #ffd43b; color: #333; }
        .severity-high { background: #ff922b; }
        .severity-critical { background: #ff6b6b; }
        .error {
            background: #fff5f5;
            color: #c92a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff6b6b;
            margin-top: 20px;
            display: none;
        }
        .error.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 LegalLens</h1>
            <p>AI-powered contract analysis & risk detection</p>
        </div>
        <div class="content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('text', this)">Tekst Analyseren</button>
                <button class="tab" onclick="switchTab('file', this)">Bestand Uploaden</button>
            </div>
            <div id="text-tab" class="tab-content active">
                <div class="form-group">
                    <label>Plak je contract of juridische tekst:</label>
                    <textarea id="text-input" placeholder="Plak hier de tekst..."></textarea>
                </div>
                <button onclick="analyzeText()">Analyseer Tekst</button>
            </div>
            <div id="file-tab" class="tab-content">
                <div class="form-group">
                    <label>Upload een PDF of TXT bestand:</label>
                    <input type="file" id="file-input" accept=".pdf,.txt,.docx">
                </div>
                <button onclick="analyzeFile()">Analyseer Bestand</button>
            </div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>AI is je document aan het analyseren...</p>
            </div>
            <div id="error" class="error"></div>
            <div id="result" class="result">
                <h3>📊 Analyse Resultaat</h3>
                <div id="result-content"></div>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
            hideResults();
        }
        
        function showLoading() {
            document.getElementById('loading').classList.add('active');
            hideResults();
        }
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '️ ' + message;
            errorDiv.classList.add('active');
        }
        function hideResults() {
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').classList.remove('active');
        }
        
        async function analyzeText() {
            const text = document.getElementById('text-input').value.trim();
            if (!text) { showError('Vul eerst een tekst in'); return; }
            if (text.length < 50) { showError('Tekst is te kort (minimaal 50 tekens)'); return; }
            
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/api/analyze-text`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `Server error: ${response.status}`);
                }
                const result = await response.json();
                displayResult(result);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        
        async function analyzeFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) { showError('Selecteer eerst een bestand'); return; }
            
            showLoading();
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API_BASE}/api/analyze-file`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `Server error: ${response.status}`);
                }
                const result = await response.json();
                displayResult(result);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        
        function displayResult(result) {
            const content = document.getElementById('result-content');
            let html = `
                <div class="result-section">
                    <h4>📝 Samenvatting</h4>
                    <p>${result.summary}</p>
                </div>
                <div class="result-section">
                    <h4> Betrokken Partijen</h4>
                    <p>${result.parties_involved.join(', ')}</p>
                </div>
                <div class="result-section">
                    <h4> Belangrijke Data</h4>
                    <ul>${Object.entries(result.key_dates).map(([k, v]) => `<li><strong>${k}:</strong> ${v}</li>`).join('')}</ul>
                </div>
                <div class="result-section">
                    <h4>⚠️ Risico's (${result.risks.length})</h4>
                    ${result.risks.length === 0 ? '<p>Geen risico\'s gedetecteerd</p>' : ''}
                    ${result.risks.map(r => `
                        <div class="risk-item">
                            <span class="severity-badge severity-${r.severity.toLowerCase()}">${r.severity}</span>
                            <h5>${r.clause_type}</h5>
                            <p><strong>Beschrijving:</strong> ${r.description}</p>
                            <p><strong>Advies:</strong> ${r.recommendation}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="result-section">
                    <h4>😊 Sentiment Score</h4>
                    <p>${(result.sentiment_score * 100).toFixed(1)}% positief</p>
                </div>
            `;
            content.innerHTML = html;
            document.getElementById('result').classList.add('active');
        }
    </script>
</body>
</html>
