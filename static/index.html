<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalLens - AI Legal Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 40px; }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .mode-btn {
            flex: 1;
            padding: 14px;
            border: 3px solid #667eea;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1.05em;
        }
        .mode-btn:hover {
            background: #5568d3;
            border-color: #5568d3;
            transform: translateY(-2px);
        }
        .mode-btn.active {
            background: #4c51bf;
            border-color: #4c51bf;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
        }
        .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        textarea, input[type="file"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        textarea { min-height: 200px; resize: vertical; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading { display: none; text-align: center; padding: 40px; }
        .loading.active { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result {
            opacity: 0;
            visibility: hidden;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.5s ease, max-height 0.5s ease;
        }
        .result.active {
            opacity: 1;
            visibility: visible;
            max-height: 10000px;
            margin-top: 30px;
        }
        .result-inner {
            padding: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        .result-inner h3 { color: #667eea; margin-bottom: 20px; font-size: 1.5em; }
        .result-section { margin-bottom: 25px; }
        .result-section h4 { color: #333; margin-bottom: 12px; font-size: 1.2em; }
        .result-section p { line-height: 1.6; color: #555; }
        .result-section ul { list-style: none; padding: 0; }
        .result-section ul li {
            padding: 10px;
            background: white;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
        .contract-type {
            font-size: 1.3em;
            font-weight: 600;
            color: #667eea;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .risk-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ff6b6b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .severity-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
        }
        .severity-low { background: #51cf66; }
        .severity-medium { background: #ffd43b; color: #333; }
        .severity-high { background: #ff922b; }
        .severity-critical { background: #ff6b6b; }
        .clause-quote {
            background: #fff3cd;
            padding: 12px;
            border-left: 3px solid #ffc107;
            font-style: italic;
            margin: 12px 0;
            border-radius: 4px;
        }
        .legal-ref {
            background: #e7f3ff;
            padding: 8px 12px;
            border-left: 3px solid #2196F3;
            font-size: 0.9em;
            margin: 8px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .legal-ref:hover {
            background: #d0e8ff;
            transform: translateX(5px);
        }
        .advice-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .action-plan {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .action-plan h5 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        .action-plan ul {
            list-style: none;
            padding: 0;
        }
        .action-plan ul li {
            padding: 8px 12px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 4px;
        }
        .action-plan ul li:before {
            content: "□ ";
            color: #667eea;
            font-weight: bold;
        }
        .negotiation-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ffd43b;
        }
        .position-indicator {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            margin: 5px;
        }
        .position-weak { background: #ff6b6b; color: white; }
        .position-medium { background: #ffd43b; color: #333; }
        .position-strong { background: #51cf66; color: white; }
        .dd-finding {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #2196F3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            background: #2196F3;
            color: white;
            margin-right: 10px;
        }
        .financial-impact {
            background: #e8f5e9;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-weight: 600;
            color: #2e7d32;
        }
        .sentiment-bar-container {
            background: #e0e0e0;
            height: 35px;
            border-radius: 18px;
            overflow: hidden;
            margin-top: 12px;
        }
        .sentiment-bar {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            transition: width 0.8s ease;
        }
        .time-saved {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .error {
            background: #fff5f5;
            color: #c92a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff6b6b;
            margin-top: 20px;
            display: none;
        }
        .error.active { display: block; }
        
        /* ✅ NIEUW: Sidebar Panel */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: -600px;
            width: 600px;
            max-width: 100%;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: right 0.3s ease;
            overflow-y: auto;
        }
        .sidebar.active {
            right: 0;
        }
        .sidebar-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .sidebar-header h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        .sidebar-header .subtitle {
            opacity: 0.9;
            font-size: 1.1em;
        }
        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            transition: all 0.3s;
        }
        .sidebar-close:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }
        .sidebar-content {
            padding: 30px;
        }
        .sidebar-section {
            margin-bottom: 30px;
        }
        .sidebar-section h3 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .sidebar-section .text-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 1.05em;
        }
        .sidebar-section .commentary {
            background: #fff9e6;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
            line-height: 1.6;
        }
        .sidebar-section .related-articles {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .sidebar-section .related-article-btn {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .sidebar-section .related-article-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .sidebar-section .history-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #667eea;
        }
        .sidebar-section .history-item .year {
            font-weight: 600;
            color: #667eea;
        }
        .sidebar-section .jurisprudence-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #2196F3;
        }
        .sidebar-section .jurisprudence-item .ecli {
            font-weight: 600;
            color: #2196F3;
            font-size: 0.9em;
        }
        .sidebar-section .jurisprudence-item .court {
            color: #666;
            font-size: 0.9em;
        }
        .sidebar-section .jurisprudence-item .summary {
            margin-top: 8px;
            line-height: 1.5;
        }
        .sidebar-section .relevance-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 8px;
        }
        .relevance-hoog { background: #51cf66; color: white; }
        .relevance-gemiddeld { background: #ffd43b; color: #333; }
        .relevance-laag { background: #e0e0e0; color: #666; }
        
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .export-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .export-btn:hover {
            background: #667eea;
            color: white;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 LegalLens</h1>
            <p>AI-powered legal analysis for professionals</p>
        </div>
        
        <div class="content">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('standard', this)">📄 Standaard</button>
                <button class="mode-btn" onclick="setMode('advocaat', this)">⚖️ Advocaat Mode</button>
            </div>
            
            <div class="tabs">
                <button class="tab active" onclick="switchTab('text', this)">Tekst Analyseren</button>
                <button class="tab" onclick="switchTab('file', this)">Bestand Uploaden</button>
            </div>
            
            <div id="text-tab" class="tab-content active">
                <div class="form-group">
                    <label>Plak je contract of juridische tekst:</label>
                    <textarea id="text-input" placeholder="Plak hier de tekst..."></textarea>
                </div>
                <div class="form-group">
                    <label>Analyse type:</label>
                    <select id="analysis-type">
                        <option value="contract">📋 Contract Analyse (Algemeen)</option>
                        <option value="due_diligence"> Due Diligence</option>
                        <option value="huurrecht">🏠 Huurrecht</option>
                        <option value="arbeidsrecht">💼 Arbeidsrecht</option>
                        <option value="familierecht">👨👩‍👧 Familierecht</option>
                        <option value="ondernemingsrecht">🏢 Ondernemingsrecht / M&A</option>
                        <option value="bestuursrecht">🏛️ Bestuursrecht</option>
                        <option value="strafrecht">️ Strafrecht</option>
                        <option value="aansprakelijkheid">🛡️ Aansprakelijkheid</option>
                        <option value="ip">💡 Intellectueel Eigendom</option>
                        <option value="compliance">✅ Compliance Check</option>
                        <option value="both">📊 Volledige Analyse (Contract + Due Diligence)</option>
                    </select>
                </div>
                <button onclick="analyzeText()">Analyseer Tekst</button>
            </div>
            
            <div id="file-tab" class="tab-content">
                <div class="form-group">
                    <label>Upload een PDF of TXT bestand:</label>
                    <input type="file" id="file-input" accept=".pdf,.txt,.docx">
                </div>
                <div class="form-group">
                    <label>Analyse type:</label>
                    <select id="file-analysis-type">
                        <option value="contract">📋 Contract Analyse (Algemeen)</option>
                        <option value="due_diligence">🔍 Due Diligence</option>
                        <option value="huurrecht">🏠 Huurrecht</option>
                        <option value="arbeidsrecht">💼 Arbeidsrecht</option>
                        <option value="familierecht">👨‍👩‍👧 Familierecht</option>
                        <option value="ondernemingsrecht">🏢 Ondernemingsrecht / M&A</option>
                        <option value="bestuursrecht">️ Bestuursrecht</option>
                        <option value="strafrecht">⚖️ Strafrecht</option>
                        <option value="aansprakelijkheid">🛡️ Aansprakelijkheid</option>
                        <option value="ip"> Intellectueel Eigendom</option>
                        <option value="compliance">✅ Compliance Check</option>
                        <option value="both">📊 Volledige Analyse (Contract + Due Diligence)</option>
                    </select>
                </div>
                <button onclick="analyzeFile()">Analyseer Bestand</button>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>AI is je document aan het analyseren...</p>
            </div>
            
            <div id="error" class="error"></div>
            
            <div id="result" class="result">
                <div class="result-inner">
                    <h3>📊 Analyse Resultaat</h3>
                    <div id="result-content"></div>
                    <div class="export-buttons">
                        <button class="export-btn" onclick="exportToPDF()">📄 Export PDF</button>
                        <button class="export-btn" onclick="exportToWord()">📝 Export Word</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ NIEUW: Sidebar Panel -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="sidebar-close" onclick="closeSidebar()">×</button>
            <h2 id="sidebar-title">📚 Wetsartikel</h2>
            <div class="subtitle" id="sidebar-subtitle">Laden...</div>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Content wordt dynamisch geladen -->
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentMode = 'standard';
        let currentAnalysis = null;
        
        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
            hideResults();
        }
        
        function showLoading() {
            document.getElementById('loading').classList.add('active');
            hideResults();
        }
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.classList.add('active');
        }
        function hideResults() {
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').classList.remove('active');
        }
        
        // ✅ NIEUW: Sidebar functies
        function openSidebar(article) {
            document.getElementById('sidebar-overlay').classList.add('active');
            document.getElementById('sidebar').classList.add('active');
            loadLegalCommentary(article);
        }
        
        function closeSidebar() {
            document.getElementById('sidebar-overlay').classList.remove('active');
            document.getElementById('sidebar').classList.remove('active');
        }
        
        async function loadLegalCommentary(article) {
            const content = document.getElementById('sidebar-content');
            const title = document.getElementById('sidebar-title');
            const subtitle = document.getElementById('sidebar-subtitle');
            
            title.textContent = '📚 Laden...';
            subtitle.textContent = 'Even geduld';
            content.innerHTML = '<div class="loading active"><div class="spinner"></div></div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/legal-commentary`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ article: article })
                });
                
                if (!response.ok) {
                    throw new Error('Artikel niet gevonden');
                }
                
                const data = await response.json();
                
                title.textContent = `⚖️ ${data.article}`;
                subtitle.textContent = data.title;
                
                let html = `
                    <div class="sidebar-section">
                        <h3>📜 Wettekst</h3>
                        <div class="text-content">${data.text}</div>
                    </div>
                    
                    <div class="sidebar-section">
                        <h3>💡 AI Juridisch Commentaar</h3>
                        <div class="commentary">${data.commentary}</div>
                    </div>
                `;
                
                if (data.related && data.related.length > 0) {
                    html += `
                        <div class="sidebar-section">
                            <h3> Gerelateerde Artikelen</h3>
                            <div class="related-articles">
                                ${data.related.map(art => `
                                    <button class="related-article-btn" onclick="openSidebar('${art}')">${art}</button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
                
                if (data.history && data.history.length > 0) {
                    html += `
                        <div class="sidebar-section">
                            <h3> Wijzigingsgeschiedenis</h3>
                            ${data.history.map(h => `
                                <div class="history-item">
                                    <div class="year">${h.year}</div>
                                    <div>${h.change}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
                
                if (data.jurisprudence && data.jurisprudence.length > 0) {
                    html += `
                        <div class="sidebar-section">
                            <h3>⚖️ Relevante Jurisprudentie</h3>
                            ${data.jurisprudence.map(j => `
                                <div class="jurisprudence-item">
                                    <div class="ecli">${j.ecli}</div>
                                    <div class="court">${j.court} - ${j.date}</div>
                                    <div class="summary">${j.summary}</div>
                                    <span class="relevance-badge relevance-${j.relevance}">${j.relevance} relevantie</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
                
                content.innerHTML = html;
                
            } catch (error) {
                content.innerHTML = `<div class="error active">⚠️ ${error.message}</div>`;
            }
        }
        
        async function analyzeText() {
            const text = document.getElementById('text-input').value.trim();
            const analysisType = document.getElementById('analysis-type').value;
            
            if (!text) { showError('Vul eerst een tekst in'); return; }
            if (text.length < 50) { showError('Tekst is te kort (minimaal 50 tekens)'); return; }
            
            showLoading();
            
            try {
                const response = await fetch(`${API_BASE}/api/analyze-text`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, mode: currentMode, analysis_type: analysisType })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `Server error: ${response.status}`);
                }
                
                const result = await response.json();
                currentAnalysis = result;
                displayResult(result);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        
        async function analyzeFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            const analysisType = document.getElementById('file-analysis-type').value;
            
            if (!file) { showError('Selecteer eerst een bestand'); return; }
            
            showLoading();
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('mode', currentMode);
                formData.append('analysis_type', analysisType);
                
                const response = await fetch(`${API_BASE}/api/analyze-file`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `Server error: ${response.status}`);
                }
                
                const result = await response.json();
                currentAnalysis = result;
                displayResult(result);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        
        function displayResult(result) {
            const content = document.getElementById('result-content');
            const sentimentColor = result.sentiment_score > 0.7 ? '#51cf66' : 
                                  result.sentiment_score > 0.4 ? '#ffd43b' : '#ff6b6b';
            const sentimentText = result.sentiment_score > 0.7 ? '✅ Gunstig' : 
                                 result.sentiment_score > 0.4 ? '⚠️ Gemengd' : ' Ongunstig';
            
            let html = '';
            
            if (result.time_saved_hours > 0) {
                html += `<div class="time-saved">⏱️ Tijdbesparing: ${result.time_saved_hours} uur handmatig werk</div>`;
            }
            
            html += `
                <div class="result-section">
                    <h4>📋 Type Document</h4>
                    <div class="contract-type">${result.contract_type || 'Onbekend'}</div>
                </div>
                
                <div class="result-section">
                    <h4>📝 Samenvatting</h4>
                    <p>${result.summary}</p>
                </div>
                
                <div class="result-section">
                    <h4> Betrokken Partijen</h4>
                    <ul>${result.parties_involved.map(p => `<li>👤 ${p}</li>`).join('')}</ul>
                </div>
                
                <div class="result-section">
                    <h4>📅 Belangrijke Data</h4>
                    <ul>${Object.entries(result.key_dates).map(([k, v]) => 
                        `<li><strong>${k.replace('_', ' ')}:</strong> ${v}</li>`
                    ).join('')}</ul>
                </div>
            `;
            
            if (result.due_diligence_findings && result.due_diligence_findings.length > 0) {
                html += `
                    <div class="result-section">
                        <h4>🔍 Due Diligence Bevindingen (${result.due_diligence_findings.length})</h4>
                        ${result.due_diligence_findings.map(f => `
                            <div class="dd-finding">
                                <span class="category-badge">${f.category}</span>
                                <span class="severity-badge severity-${f.severity.toLowerCase()}">${f.severity}</span>
                                <h5>${f.title}</h5>
                                <p><strong>Beschrijving:</strong> ${f.description}</p>
                                ${f.legal_reference ? `<div class="legal-ref" onclick="openSidebar('${f.legal_reference}')">⚖️ ${f.legal_reference} (klik voor details)</div>` : ''}
                                <p><strong>Aanbeveling:</strong> ${f.recommendation}</p>
                                ${f.financial_impact ? `<div class="financial-impact">💰 Financiële impact: ${f.financial_impact}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            html += `
                <div class="result-section">
                    <h4>️ Risico's (${result.risks.length})</h4>
                    ${result.risks.length === 0 ? '<p style="color: #51cf66; font-weight: 600;">✅ Geen risico\'s gedetecteerd</p>' : ''}
                    ${result.risks.map(r => `
                        <div class="risk-item">
                            <span class="severity-badge severity-${r.severity.toLowerCase()}">${r.severity}</span>
                            <h5>${r.clause_type}</h5>
                            <p><strong>📋 Beschrijving:</strong> ${r.description}</p>
                            ${r.clause_quote ? `<div class="clause-quote"><strong>💬 Citaat:</strong><br>"${r.clause_quote}"</div>` : ''}
                            ${r.legal_reference ? `<div class="legal-ref" onclick="openSidebar('${r.legal_reference}')">⚖️ ${r.legal_reference} (klik voor details)</div>` : ''}
                            <p><strong>💡 Advies:</strong> ${r.recommendation}</p>
                        </div>
                    `).join('')}
                </div>
            `;
            
            if (result.action_plan && (result.action_plan.direct || result.action_plan.short_term || result.action_plan.long_term)) {
                html += `
                    <div class="result-section">
                        <h4>📋 Strategisch Actieplan</h4>
                        ${result.action_plan.direct && result.action_plan.direct.length > 0 ? `
                            <div class="action-plan">
                                <h5>🔴 Direct (deze week)</h5>
                                <ul>${result.action_plan.direct.map(a => `<li>${a}</li>`).join('')}</ul>
                            </div>
                        ` : ''}
                        ${result.action_plan.short_term && result.action_plan.short_term.length > 0 ? `
                            <div class="action-plan">
                                <h5>🟡 Korte termijn (deze maand)</h5>
                                <ul>${result.action_plan.short_term.map(a => `<li>${a}</li>`).join('')}</ul>
                            </div>
                        ` : ''}
                        ${result.action_plan.long_term && result.action_plan.long_term.length > 0 ? `
                            <div class="action-plan">
                                <h5>🟢 Lange termijn</h5>
                                <ul>${result.action_plan.long_term.map(a => `<li>${a}</li>`).join('')}</ul>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
            
            if (result.negotiation_strategy && result.negotiation_strategy.your_position) {
                const posClass = (pos) => {
                    if (!pos) return '';
                    const lower = pos.toLowerCase();
                    if (lower.includes('zwak') || lower.includes('weak')) return 'position-weak';
                    if (lower.includes('sterk') || lower.includes('strong')) return 'position-strong';
                    return 'position-medium';
                };
                
                html += `
                    <div class="result-section">
                        <h4>💼 Onderhandelingsstrategie</h4>
                        <div class="negotiation-box">
                            <p><strong>Jouw positie:</strong> <span class="position-indicator ${posClass(result.negotiation_strategy.your_position)}">${result.negotiation_strategy.your_position}</span></p>
                            <p><strong>Tegenpartij positie:</strong> <span class="position-indicator ${posClass(result.negotiation_strategy.counterparty_position)}">${result.negotiation_strategy.counterparty_position}</span></p>
                            
                            ${result.negotiation_strategy.arguments && result.negotiation_strategy.arguments.length > 0 ? `
                                <h5 style="margin-top: 15px;">💪 Argumenten om te gebruiken:</h5>
                                <ul>${result.negotiation_strategy.arguments.map(a => `<li>✓ ${a}</li>`).join('')}</ul>
                            ` : ''}
                            
                            ${result.negotiation_strategy.alternatives && result.negotiation_strategy.alternatives.length > 0 ? `
                                <h5 style="margin-top: 15px;">🔄 Alternatieve voorstellen:</h5>
                                <ul>${result.negotiation_strategy.alternatives.map(a => `<li>→ ${a}</li>`).join('')}</ul>
                            ` : ''}
                            
                            ${result.negotiation_strategy.fallback ? `
                                <h5 style="margin-top: 15px;">🛡️ Fallback positie:</h5>
                                <p>${result.negotiation_strategy.fallback}</p>
                            ` : ''}
                        </div>
                    </div>
                `;
            }
            
            html += `
                <div class="result-section">
                    <h4>🎯 Algemeen Advies</h4>
                    <div class="advice-box">${result.overall_advice}</div>
                </div>
                
                <div class="result-section">
                    <h4>😊 Sentiment Score</h4>
                    <div class="sentiment-bar-container">
                        <div class="sentiment-bar" style="background: ${sentimentColor}; width: ${result.sentiment_score * 100}%;">
                            ${(result.sentiment_score * 100).toFixed(1)}%
                        </div>
                    </div>
                    <p style="margin-top: 12px; color: #666; font-weight: 500;">${sentimentText}</p>
                </div>
            `;
            
            content.innerHTML = html;
            setTimeout(() => {
                document.getElementById('result').classList.add('active');
            }, 100);
        }
        
        function exportToPDF() {
            if (!currentAnalysis) {
                showError('Geen analyse beschikbaar om te exporteren');
                return;
            }
            // TODO: Implementeer PDF export
            alert('PDF export functionaliteit wordt ontwikkeld. Gebruik voor nu de browser print functie (Ctrl+P).');
        }
        
        function exportToWord() {
            if (!currentAnalysis) {
                showError('Geen analyse beschikbaar om te exporteren');
                return;
            }
            // TODO: Implementeer Word export
            alert('Word export functionaliteit wordt ontwikkeld.');
        }
    </script>
</body>
